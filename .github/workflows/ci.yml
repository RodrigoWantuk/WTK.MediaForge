name: cross-platform-ci

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_hardware_media:
        description: Run the strict RX 580 hardware-media qualification job.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cross-platform-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Environment diagnostics
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          dotnet --info
          try {
            Get-CimInstance Win32_VideoController -ErrorAction Stop |
              Select-Object Name, DriverVersion |
              Format-Table
          }
          catch {
            Write-Warning "GPU diagnostics unavailable: $($_.Exception.Message)"
          }

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore .\WTK.MediaForge.sln --locked-mode

      - name: Build solution
        shell: pwsh
        run: >-
          dotnet build .\WTK.MediaForge.sln
          --no-restore
          --configuration Release
          --verbosity minimal

      - name: Run portable tests
        shell: pwsh
        run: >-
          dotnet test .\WTK.MediaForge.sln
          --no-restore
          --no-build
          --configuration Release
          --filter "Category!=GPU&Category!=Stress&Category!=Performance"
          --logger "trx;LogFilePrefix=windows-portable"
          --results-directory .\test-reports\windows
          --verbosity minimal

      - name: Fast gate
        shell: pwsh
        run: .\scripts\test.ps1 -Tier Fast

      - name: Transport and license policies
        shell: pwsh
        run: |
          .\scripts\verify-media-transport-rules.ps1
          .\scripts\verify-license-policy.ps1

      - name: Validate aggregate release gate entrypoint
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\scripts\verify-final-gate.ps1),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "verify-final-gate.ps1 contains syntax errors."
          }

      - name: Publish Windows reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-${{ github.run_id }}
          path: test-reports/windows
          if-no-files-found: ignore

  linux:
    name: Linux build and tests
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Environment diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          uname -a
          dotnet --info
          if command -v vulkaninfo >/dev/null 2>&1; then
            vulkaninfo --summary
          else
            echo "vulkaninfo is not installed; continuing without GPU diagnostics."
          fi
          if [ -d /dev/dri ]; then
            ls -la /dev/dri
          else
            echo "/dev/dri is not available; continuing with portable validation."
          fi

      - name: Restore Linux project set
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            WTK.MediaForge.Core/WTK.MediaForge.Core.csproj
            WTK.MediaForge.Diagnostics/WTK.MediaForge.Diagnostics.csproj
            WTK.MediaForge.Capture/WTK.MediaForge.Capture.csproj
            WTK.MediaForge.Graphics.Interop/WTK.MediaForge.Graphics.Interop.csproj
            WTK.MediaForge.Graphics.Vulkan/WTK.MediaForge.Graphics.Vulkan.csproj
            WTK.MediaForge.Composition/WTK.MediaForge.Composition.csproj
            WTK.MediaForge.Linux/WTK.MediaForge.Linux.csproj
            WTK.MediaForge.Remote/WTK.MediaForge.Remote.csproj
            WTK.MediaForge.Remote.WebRtc/WTK.MediaForge.Remote.WebRtc.csproj
            WTK.MediaForge.Remote.Signaling/WTK.MediaForge.Remote.Signaling.csproj
            WTK.MediaForge.Testing/WTK.MediaForge.Testing.csproj
          )
          for project in "${projects[@]}"; do
            echo "Restoring $project"
            dotnet restore "$project" --locked-mode
          done

      - name: Build Linux project set
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            WTK.MediaForge.Core/WTK.MediaForge.Core.csproj
            WTK.MediaForge.Diagnostics/WTK.MediaForge.Diagnostics.csproj
            WTK.MediaForge.Capture/WTK.MediaForge.Capture.csproj
            WTK.MediaForge.Graphics.Interop/WTK.MediaForge.Graphics.Interop.csproj
            WTK.MediaForge.Graphics.Vulkan/WTK.MediaForge.Graphics.Vulkan.csproj
            WTK.MediaForge.Composition/WTK.MediaForge.Composition.csproj
            WTK.MediaForge.Linux/WTK.MediaForge.Linux.csproj
            WTK.MediaForge.Remote/WTK.MediaForge.Remote.csproj
            WTK.MediaForge.Remote.WebRtc/WTK.MediaForge.Remote.WebRtc.csproj
            WTK.MediaForge.Remote.Signaling/WTK.MediaForge.Remote.Signaling.csproj
            WTK.MediaForge.Testing/WTK.MediaForge.Testing.csproj
          )
          for project in "${projects[@]}"; do
            echo "Building $project"
            dotnet build "$project" \
              --no-restore \
              --configuration Release \
              --verbosity minimal
          done

      - name: Restore Linux portable test set
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            Tests/WTK.MediaForge.Core.Tests/WTK.MediaForge.Core.Tests.csproj
            Tests/WTK.MediaForge.Diagnostics.Tests/WTK.MediaForge.Diagnostics.Tests.csproj
            Tests/WTK.MediaForge.Capture.Tests/WTK.MediaForge.Capture.Tests.csproj
            Tests/WTK.MediaForge.Composition.Tests/WTK.MediaForge.Composition.Tests.csproj
            Tests/WTK.MediaForge.Graphics.Vulkan.Tests/WTK.MediaForge.Graphics.Vulkan.Tests.csproj
            Tests/WTK.MediaForge.Remote.Tests/WTK.MediaForge.Remote.Tests.csproj
          )
          for project in "${tests[@]}"; do
            echo "Restoring $project"
            dotnet restore "$project" --locked-mode
          done

      - name: Run Linux portable tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            Tests/WTK.MediaForge.Core.Tests/WTK.MediaForge.Core.Tests.csproj
            Tests/WTK.MediaForge.Diagnostics.Tests/WTK.MediaForge.Diagnostics.Tests.csproj
            Tests/WTK.MediaForge.Capture.Tests/WTK.MediaForge.Capture.Tests.csproj
            Tests/WTK.MediaForge.Composition.Tests/WTK.MediaForge.Composition.Tests.csproj
            Tests/WTK.MediaForge.Graphics.Vulkan.Tests/WTK.MediaForge.Graphics.Vulkan.Tests.csproj
            Tests/WTK.MediaForge.Remote.Tests/WTK.MediaForge.Remote.Tests.csproj
          )
          mkdir -p test-reports/linux
          for project in "${tests[@]}"; do
            name="$(basename "${project%.csproj}")"
            echo "Testing $project"
            dotnet test "$project" \
              --no-restore \
              --configuration Release \
              --filter "Category!=GPU&Category!=Stress&Category!=Performance" \
              --logger "trx;LogFileName=${name}.trx" \
              --results-directory test-reports/linux \
              --verbosity minimal
          done

      - name: Publish Linux reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-validation-${{ github.run_id }}
          path: test-reports/linux
          if-no-files-found: ignore

  hardware-media-rx580:
    name: Windows RX 580 hardware qualification
    if: github.event_name == 'workflow_dispatch' && inputs.run_hardware_media
    runs-on: [self-hosted, Windows, mediaforge-rx580]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore .\WTK.MediaForge.sln --locked-mode

      - name: Strict hardware-media readiness
        shell: pwsh
        run: .\scripts\verify-engine-readiness-v14.ps1 -RequireHardwareMedia

      - name: Publish hardware evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rx580-hardware-media-proof-${{ github.run_id }}
          path: test-reports
          if-no-files-found: error
