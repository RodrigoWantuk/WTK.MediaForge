name: finalize-portable-vulkan-lock

on:
  push:
    branches:
      - fix/vulkan-platform-boundaries

permissions:
  contents: write

concurrency:
  group: finalize-portable-vulkan-lock
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize portable Vulkan lock
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/vulkan-platform-boundaries

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Regenerate and verify locked dependencies
        shell: bash
        run: |
          set -euo pipefail

          project="WTK.MediaForge.Graphics.Vulkan.Tests/WTK.MediaForge.Graphics.Vulkan.Tests.csproj"
          lock="WTK.MediaForge.Graphics.Vulkan.Tests/packages.lock.json"

          dotnet restore "$project" --force-evaluate
          grep -q '"net8.0"' "$lock"
          if grep -q 'net8.0-windows' "$lock"; then
            echo "Windows target remains in portable Vulkan lock."
            exit 1
          fi
          dotnet restore "$project" --locked-mode

      - name: Commit final lock and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail

          rm .github/workflows/vulkan-platform-boundary-validation.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WTK.MediaForge.Graphics.Vulkan.Tests/packages.lock.json
          git add .github/workflows/vulkan-platform-boundary-validation.yml

          if git diff --cached --quiet; then
            echo "No finalization changes were produced."
            exit 1
          fi

          git commit -m "Finalize portable Vulkan test lock"
          git push origin HEAD:fix/vulkan-platform-boundaries
